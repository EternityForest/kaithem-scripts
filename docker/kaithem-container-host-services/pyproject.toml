[project]
name = "kaithem-host-services"
version = "0.1.0"
description = "Per-user host helper for containers: PAM-backed password check over a Unix-domain socket."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-pam>=2.0.2",
    # python-pam 2.x doesn't declare this dependency but uses it at import time.
    "six>=1.16",
]

[project.scripts]
kaithem-host-services = "kaithem_host_services:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaithem_host_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

